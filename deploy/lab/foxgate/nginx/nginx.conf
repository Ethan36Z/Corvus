worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Omit query strings, request bodies, credentials and cookies from logs.
    log_format foxgate '$remote_addr - $host "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent';
    access_log /dev/stdout foxgate;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 10m;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_accept $foxgate_accepts_html {
        default 0;
        ~*text/html 1;
    }
    map $http_upgrade $foxgate_connection_upgrade {
        default upgrade;
        ''      '';
    }
    # The actual loopback peer is the rate-limit key. Do not trust client IP headers.
    map $request_method $foxgate_login_limit_key {
        default '';
        POST    $binary_remote_addr;
    }
    limit_req_zone $foxgate_login_limit_key zone=foxgate_lab_login:1m rate=5r/m;
    limit_req_status 429;
    limit_req_log_level notice;

    server {
        listen 127.0.0.1:8100 default_server;
        server_name _;
        return 404;
    }

    server {
        listen 127.0.0.1:8100;
        server_name lab-corvus.foxluma.com;
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        # A failed non-idempotent request must never be retried at this gateway.
        proxy_next_upstream off;
        include /etc/nginx/foxgate/gated-locations.conf;
    }
}
