location = /_foxgate/verify {
    internal;
    proxy_pass http://127.0.0.1:8101/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host 127.0.0.1:8101;
    proxy_set_header X-FoxGate-Original-Host lab-corvus.foxluma.com;
    proxy_set_header X-FoxGate-Original-URI $request_uri;
}

location = /_foxgate/login {
    limit_req zone=foxgate_lab_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:8101/login;
    proxy_set_header Authorization "";
    proxy_set_header Host 127.0.0.1:8101;
    proxy_set_header X-FoxGate-Login-Path /_foxgate/login;
    proxy_set_header X-FoxGate-Original-Host lab-corvus.foxluma.com;
}

location = /_foxgate/logout {
    proxy_pass http://127.0.0.1:8101/logout;
    proxy_set_header Authorization "";
    proxy_set_header Host 127.0.0.1:8101;
    proxy_set_header X-FoxGate-Original-Host lab-corvus.foxluma.com;
}

# Only HTML navigation is redirected; API and WebSocket clients keep HTTP 401.
# FoxGate Auth validates the redirect as a safe relative path.
location @foxgate_unauthorized {
    if ($foxgate_accepts_html = 0) {
        return 401;
    }
    rewrite ^ /login-redirect break;
    proxy_pass http://127.0.0.1:8101;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Host 127.0.0.1:8101;
    proxy_set_header X-FoxGate-Login-Path /_foxgate/login;
    proxy_set_header X-FoxGate-Original-Host lab-corvus.foxluma.com;
    proxy_set_header X-FoxGate-Original-URI $request_uri;
}

location / {
    auth_request /_foxgate/verify;
    error_page 401 = @foxgate_unauthorized;
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_intercept_errors off;
    proxy_buffering off;
    proxy_cache off;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # This virtual host represents the future Cloudflare HTTPS route only.
    # Replace supplied forwarding fields; retain the real loopback peer as IP.
    proxy_set_header Host lab-corvus.foxluma.com;
    proxy_set_header X-Forwarded-Host lab-corvus.foxluma.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Ssl "";
    proxy_set_header X-Forwarded-Server "";

    # Open WebUI still owns downstream user authentication.
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $foxgate_connection_upgrade;
}
