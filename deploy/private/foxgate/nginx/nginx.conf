worker_processes 1;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format foxgate '$remote_addr - $host "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent';

    access_log /dev/stdout foxgate;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 10m;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_accept $foxgate_accepts_html {
        default 0;
        ~*text/html 1;
    }

    map $http_upgrade $foxgate_connection_upgrade {
        default upgrade;
        ''      '';
    }

    map $request_method $foxgate_login_limit_key {
        default '';
        POST    $binary_remote_addr;
    }

    limit_req_zone $foxgate_login_limit_key zone=foxgate_login:1m rate=5r/m;
    limit_req_status 429;
    limit_req_log_level notice;

    server {
        listen 127.0.0.1:8093 default_server;
        server_name _;
        return 404;
    }

    server {
        listen 127.0.0.1:8093;
        server_name corvus.foxluma.com;

        set $foxgate_upstream http://127.0.0.1:8097;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        include /etc/nginx/foxgate/gated-locations.conf;
    }
}
