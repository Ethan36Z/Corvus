# This internal endpoint is the only session authorization decision point.
location = /_foxgate/verify {
    internal;
    proxy_pass http://127.0.0.1:8094/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host 127.0.0.1:8094;
    proxy_set_header X-FoxGate-Original-Host $host;
    proxy_set_header X-FoxGate-Original-URI $request_uri;
}

# Login and logout are deliberately outside auth_request to avoid loops.
location = /_foxgate/login {
    limit_req zone=foxgate_login burst=5 nodelay;

    proxy_pass http://127.0.0.1:8094/login;
    proxy_set_header Authorization "";
    proxy_set_header Host 127.0.0.1:8094;
    proxy_set_header X-FoxGate-Login-Path /_foxgate/login;
    proxy_set_header X-FoxGate-Original-Host $host;
}

location = /_foxgate/logout {
    proxy_pass http://127.0.0.1:8094/logout;
    proxy_set_header Authorization "";
    proxy_set_header Host 127.0.0.1:8094;
    proxy_set_header X-FoxGate-Original-Host $host;
}

# HTML navigations receive a safe login redirect generated by the auth service.
# Non-HTML clients receive the original 401 without an HTML response body.
location @foxgate_unauthorized {
    if ($foxgate_accepts_html = 0) {
        return 401;
    }

    rewrite ^ /login-redirect break;
    proxy_pass http://127.0.0.1:8094;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Host 127.0.0.1:8094;
    proxy_set_header X-FoxGate-Login-Path /_foxgate/login;
    proxy_set_header X-FoxGate-Original-Host $host;
    proxy_set_header X-FoxGate-Original-URI $request_uri;
}

location / {
    auth_request /_foxgate/verify;
    error_page 401 = @foxgate_unauthorized;

    proxy_pass $foxgate_upstream;
    proxy_http_version 1.1;
    proxy_intercept_errors off;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Downstream authentication is application-owned and remains untouched.
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $foxgate_connection_upgrade;
}
