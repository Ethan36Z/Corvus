services:
  corvus-llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda12-b10630
    container_name: corvus-llama
    restart: unless-stopped

    ports:
      - "127.0.0.1:8095:8080"

    volumes:
      - /home/ethan/srv/shared/models/qwen3.5-9b:/models:ro

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    command:
      - -m
      - /models/Qwen_Qwen3.5-9B-Q5_K_M.gguf
      - --mmproj
      - /models/mmproj-Qwen_Qwen3.5-9B-bf16.gguf
      - --no-mmproj-offload
      - --alias
      - corvus
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "8192"
      - -ngl
      - "99"
      - -t
      - "8"
      - -b
      - "512"
      - -ub
      - "512"
      - --parallel
      - "1"
      - --no-cache-prompt

  corvus-web:
    build:
      context: .
      dockerfile: playground/Dockerfile.production
    container_name: corvus-web
    restart: unless-stopped
    network_mode: host

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8097/healthz || exit 1
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  corvus-kokoro:
    image: ghcr.io/hsiang-han/kokoro-fastapi-zh-cpu@sha256:a675c4d280ff08002778468a2687d35c27d0a9709c6a8259afbfa573a72e7e2b
    container_name: corvus-kokoro
    restart: unless-stopped

    ports:
      - "127.0.0.1:8105:8880"

    environment:
      USE_GPU: "false"
      PYTHONUNBUFFERED: "1"
      REPO_ID: "hexgrad/Kokoro-82M-v1.1-zh"
      KOKORO_V1_FILE: "v1_1_zh/kokoro-v1_1-zh.pth"
      VOICES_DIR: "/app/api/src/voices/v1_1_zh"
      DEFAULT_VOICE: "af_mica"
      DEFAULT_VOICE_CODE: "z"

    volumes:
      - /home/ethan/srv/shared/models/kokoro-voices/community:/app/api/src/voices/v1_1_zh:ro
